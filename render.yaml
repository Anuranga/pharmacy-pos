services:
  # Web Application Service (Docker)
  - type: web
    name: pharmacare-pos
    runtime: docker
    plan: free
    region: oregon # or frankfurt, singapore, ohio
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "PharmaCare POS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DATABASE
        value: "true"
      # If using Render's built-in Postgres database:
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacare-db
          property: connectionString

databases:
  # Free Managed PostgreSQL Database on Render
  - name: pharmacare-db
    plan: free
    region: oregon
    databaseName: pharmacare
    user: pharmacare_user
